<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parole a Catena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              mono: ['Space Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #f5f5f5;
        --dot-color: #d4d4d4;
        --scrollbar-track: #f5f5f5;
        --scrollbar-thumb: #000;
        --scrollbar-border: #f5f5f5;
      }

      .dark {
        --bg-color: #171717; /* Neutral 900 */
        --dot-color: #404040; /* Neutral 700 */
        --scrollbar-track: #171717;
        --scrollbar-thumb: #e5e5e5;
        --scrollbar-border: #171717;
      }

      body {
        font-family: 'Space Mono', monospace;
        background-color: var(--bg-color);
        background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
        background-size: 20px 20px;
        transition: background-color 0.3s ease;
      }

      /* Custom scrollbar to match the brutalist/paper theme */
      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scrollbar-track);
        border-left: 2px solid var(--scrollbar-thumb);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border: 2px solid var(--scrollbar-border);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }

      p {
        font-size: 1.125rem;
        line-height: 1.6;
      }
    </style>
  <script type="importmap">

  }
}
</script>
