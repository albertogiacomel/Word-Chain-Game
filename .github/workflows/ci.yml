name: Verify Word-Chain-Game
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check:types
      - run: npm run build
      - run: npm run test:kit
      - name: Verify controls and gameplay in Chrome
        run: npm run test:kit:browser
        env:
          BROWSER_BINARY: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: game-kit-verification
          path: |
            artifacts/game-kit/*.json
            artifacts/game-kit/*.png

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: albertogiacomel/AgentPippo/.github/workflows/recover-games.yml@23dae6d92efe87f2da341ecacd95aa822ddb3cae
    with:
      game: Word-Chain-Game
      source_ref: ${{ github.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
